layer: "application"
language: "go"
stack: "backend"

tasks:
  serve:
    command: "go tool air"
    options:
      envFile: "/.env"

  build:
    command: "go build"
    args:
      - "-o"
      - "./bin/api"
      - "./server.go"
    inputs:
      - "./**/*.go"
      - "!./**/*_test.go"
      - "go.mod"
      - "go.sum"
    outputs:
      - "./bin/api"
    description: "Compila el binario de producción"

  codegen:
    script: "go run ./internal/tools/autofilter/autofilter.go && go run ./internal/tools/autopaginated && go run github.com/99designs/gqlgen generate"
    inputs:
      - "./graph/*.graphqls"
      - "./internal/**/*.graphqls"
      - "./internal/tools/autopaginated/*.go"
      - "./internal/tools/autofilter/*.go"
      - "./gqlgen.yml"

  test:
    command: "go test ./..."
    inputs:
      - "./**/*.go"

  lint:
    command: "golangci-lint"
    args:
      - "run"
      - "./..."
      - "--config=.golangci.yml"
    inputs:
      - "**/*.go"
      - ".golangci.yml"
