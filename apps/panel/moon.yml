$schema: "https://moonrepo.dev/schemas/project.json"

layer: "application"

language: "typescript"
stack: "frontend"

tags:
  - "next"

fileGroups:
  configs:
    - "*.config.*"
    - "*.json"

tasks:
  serve:
    deps:
      - "codegen-watch"
    command: "bun next dev"
    args:
      - "--port"
      - "4000"
    env:
      PORT: "${NEXT_PORT:-4000}"
    options:
      envFile: true
      persistent: true
    description: "Alias de dev - Inicia el servidor de desarrollo"

  dev:
    deps:
      - "codegen-watch"
    command: "bun next dev"
    args:
      - "--port"
      - "$PORT"
    env:
      PORT: "${NEXT_PORT:-4000}"
    options:
      envFile: true
      persistent: true
    description: "Inicia el servidor de desarrollo"

  codegen:
    command: "bunx graphql-codegen"
    args:
      - "--config"
      - "codegen.ts"
    options:
      runInCI: false
      envFile: true
    inputs:
      - "codegen.ts"
      - "src/**/*.{ts,tsx}"
    outputs:
      - "./schema.graphql"
      - "./src/providers/graphql/**/*"
    description: "Genera los tipos de GraphQL"

  codegen-watch:
    command: "bunx graphql-codegen"
    args:
      - "--config"
      - "codegen.ts"
      - "--watch"
    options:
      runInCI: false
      envFile: true
      persistent: true
    inputs:
      - "codegen.ts"
      - "src/**/*.{ts,tsx}"
    outputs:
      - "./schema.graphql"
      - "./src/providers/graphql/**/*"
    description: "Genera los tipos de GraphQL y se mantiene en escucha de cambios"

  build:
    command: "bun next build"
    options:
      envFile: true
    description: "Build de producción"
    inputs:
      - "@group(next)"
      - "@group(sources)"
      - "postcss.config.mjs"
      - "tailwind.config.*"
    outputs:
      - ".next"

  start:
    command: "next start"
    args:
      - "--port"
      - "$NEXT_PORT"
    env:
      PORT: "${NEXT_PORT:-3000}"
    deps:
      - "build"
    options:
      envFile: true
      persistent: true
    description: "Inicia el servidor de producción"

  lint:
    command: "eslint"
    args:
      - "--no-error-on-unmatched-pattern"
      - "."
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "eslint.config.mjs"
    description: "Ejecuta ESLint. ROTO: eslint-plugin-react@7.37.5 no soporta eslint@10 (ver nota)"

  typecheck:
    command: "tsc"
    args:
      - "--noEmit"
    inputs:
      - "@group(next)"
      - "@group(sources)"
      - "tsconfig.json"
    description: "Verificación de tipos TypeScript"

  format:
    command: "prettier"
    args:
      - "--check"
      - "."
    inputs:
      - "@group(next)"
      - "@group(sources)"
    description: "Verifica formateo con Prettier"

  format-write:
    command: "prettier"
    args:
      - "--write"
      - "."
    description: "Formatea archivos con Prettier"

  install-e2e:
    command: "bunx"
    args:
      - "playwright"
      - "install"
      - "--with-deps"
      - "chromium"
    options:
      cache: false
    description: "Descarga el Chromium que usan los tests e2e (solo una vez)"

  test-e2e:
    command: "bunx"
    args:
      - "playwright"
      - "test"
    inputs:
      - "@group(sources)"
      - "playwright.config.ts"
      - "e2e/**/*"
    outputs:
      - "e2e/.artifacts"
      - "playwright-report"
    env:
      NEXT_PORT: "${NEXT_PORT:-4000}"
    description: "Smoke tests responsivos en 375 / 768 / 1440"

  check:
    deps:
      - "typecheck"
    inputs:
      - "@group(sources)"
    description: "Verificación de tipos. NO incluye lint: está roto (ver abajo)"

# NOTA — `lint` está roto y `format` no existe
# --------------------------------------------
# 1. `lint`: `eslint-plugin-react@7.37.5` (lo arrastra `eslint-config-next@16`)
#    declara peer `eslint: ^3 || … || ^9.7`, pero el monorepo tiene
#    `eslint@^10.9.1`. Todas las reglas `react/*` mueren con
#    `contextOrFilename.getFilename is not a function`, porque ESLint 10
#    eliminó esa API. No hay versión de `eslint-plugin-react` que lo arregle:
#    7.37.5 es la última. La salida es bajar `eslint` a `^9`.
#    También se retiró el flag `--ext`, que ESLint 9 eliminó.
#
# 2. `format` / `format-write`: no hay `prettier` instalado en el monorepo ni
#    un `.prettierrc`, así que la task falla. `AGENTS.md` documenta las reglas
#    de formato pero no están cableadas a ninguna herramienta.
