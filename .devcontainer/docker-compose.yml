services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    volumes:
      - ..:/workspaces/condominio:cached
    command: sleep infinity
    environment:
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=condominio
      - POSTGRES_PASSWORD=condominio
      - POSTGRES_DB=condominio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominio -d condominio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  postgres-data:
